# Pipeline de CI para serviços Java/Spring do golden path (equivale a um "stage").
# Cada job compõe steps reutilizáveis de actions/ (equivalem aos "steps").
#
# Uso no repo do serviço:
#   jobs:
#     ci:
#       uses: gerffeson-lab/platform-pipelines-templates/.github/workflows/ci-java.yaml@v1
#       secrets: inherit   # GITOPS_APP_PRIVATE_KEY (e, no banco, credenciais do Nexus e do Quay)
#
# Deploy (GitOps): em push para develop, release/* e main, renderiza o chart da plataforma
# com deploy/values*.yaml do serviço e grava no repo GitOps, na branch do ambiente.
# Precisa na org: variável GITOPS_APP_ID e secret GITOPS_APP_PRIVATE_KEY, de um GitHub App
# instalado só no repo GitOps, com Contents: read and write.
#
# SAST no Sonar é opcional (entrada `sonar`, desligada) até o banco definir a ferramenta.
# Ligado, precisa na org: secret SONAR_TOKEN, variáveis SONAR_HOST_URL e SONAR_ORGANIZATION.
#
# As actions são referenciadas pela tag de major (@v1), que o release move junto.
# Numa versão v2, atualizar estas referências para @v2.
name: ci-java

on:
  workflow_call:
    inputs:
      java-version:
        description: Versão do Java
        type: string
        default: '21'
      openapi-path:
        description: Caminho do contrato OpenAPI
        type: string
        default: api/openapi.yaml
      publish-image:
        description: Publica a imagem em push para develop, release/*, main e tags
        type: boolean
        default: true
      deploy:
        description: Grava os manifestos no repo GitOps depois de publicar a imagem
        type: boolean
        default: true
      sonar:
        description: Liga o SAST no Sonar (SonarQube/SonarCloud), esperando o quality gate
        type: boolean
        default: false
      sonar-project-key:
        description: Chave do projeto no Sonar. Vazio usa <dono>_<repositório> (padrão do SonarCloud)
        type: string
        default: ''
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: Chave privada do GitHub App que escreve no repo GitOps
        required: false
      SONAR_TOKEN:
        description: Token do Sonar (só com sonar ligado)
        required: false

permissions:
  contents: read

jobs:
  contract:
    name: contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gerffeson-lab/platform-pipelines-templates/actions/openapi/lint@v1
        with:
          spec: ${{ inputs.openapi-path }}
      - if: github.event_name == 'pull_request'
        uses: gerffeson-lab/platform-pipelines-templates/actions/openapi/breaking-changes@v1
        with:
          spec: ${{ inputs.openapi-path }}
          base-ref: ${{ github.base_ref }}

  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gerffeson-lab/platform-pipelines-templates/actions/security/secret-scan@v1

  build:
    name: build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar (se ligado) usa o histórico para saber o que é código novo

      - uses: gerffeson-lab/platform-pipelines-templates/actions/java/maven-build@v1
        with:
          java-version: ${{ inputs.java-version }}

      - if: inputs.sonar
        uses: gerffeson-lab/platform-pipelines-templates/actions/sonar/maven@v1
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          organization: ${{ vars.SONAR_ORGANIZATION }}
          project-key: ${{ inputs.sonar-project-key || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}

      # SBOM do JAR final: inclui as dependências transitivas empacotadas
      - uses: gerffeson-lab/platform-pipelines-templates/actions/security/sbom@v1
        with:
          target: target/*.jar

  sca:
    name: SCA
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: gerffeson-lab/platform-pipelines-templates/actions/security/sca@v1
        with:
          target: sbom.cdx.json

  image:
    name: imagem
    needs: [contract, secrets, build, sca]
    if: inputs.publish-image && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - uses: gerffeson-lab/platform-pipelines-templates/actions/container/build-push@v1
        with:
          image: ${{ github.repository }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: deploy (GitOps)
    needs: image
    if: >-
      inputs.deploy && github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Confere o acesso ao repo GitOps
        env:
          APP_ID: ${{ vars.GITOPS_APP_ID }}
          KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$KEY" ]; then
            echo "::error::falta a variável GITOPS_APP_ID ou o secret GITOPS_APP_PRIVATE_KEY na org (GitHub App do repo GitOps), ou secrets: inherit no ci.yaml do serviço"
            exit 1
          fi
      - uses: actions/checkout@v4
      # mesma tag que o job de imagem publicou (docker/metadata-action: type=sha, 7 caracteres)
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: gerffeson-lab/platform-pipelines-templates/actions/gitops/deploy@v1
        with:
          image-repository: ghcr.io/${{ github.repository }}
          image-tag: ${{ steps.tag.outputs.sha }}
          app-id: ${{ vars.GITOPS_APP_ID }}
          app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
