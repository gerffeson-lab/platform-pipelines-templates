# Pipeline de CI para serviços Java/Spring do golden path (equivale a um "stage").
# Cada job compõe steps reutilizáveis de actions/ (equivalem aos "steps").
#
# Uso no repo do serviço:
#   jobs:
#     ci:
#       uses: gerffeson-lab/platform-pipelines-templates/.github/workflows/ci-java.yaml@v1
#       secrets: inherit   # SONAR_TOKEN (e, no banco, credenciais do Nexus e do Quay)
#
# Configuração da org (não do serviço):
#   secret   SONAR_TOKEN          token do SonarQube/SonarCloud
#   variável SONAR_HOST_URL       padrão https://sonarcloud.io
#   variável SONAR_ORGANIZATION   só no SonarCloud
#
# As actions são referenciadas pela tag de major (@v1), que o release move junto.
# Numa versão v2, atualizar estas referências para @v2.
name: ci-java

on:
  workflow_call:
    inputs:
      java-version:
        description: Versão do Java
        type: string
        default: '21'
      openapi-path:
        description: Caminho do contrato OpenAPI
        type: string
        default: api/openapi.yaml
      publish-image:
        description: Publica a imagem em push para develop, release/*, main e tags
        type: boolean
        default: true
      sonar-project-key:
        description: Chave do projeto no Sonar. Vazio usa <dono>_<repositório> (padrão do SonarCloud)
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: Token do Sonar (SAST obrigatório)
        required: false

permissions:
  contents: read

jobs:
  contract:
    name: contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gerffeson-lab/platform-pipelines-templates/actions/openapi/lint@v1
        with:
          spec: ${{ inputs.openapi-path }}
      - if: github.event_name == 'pull_request'
        uses: gerffeson-lab/platform-pipelines-templates/actions/openapi/breaking-changes@v1
        with:
          spec: ${{ inputs.openapi-path }}
          base-ref: ${{ github.base_ref }}

  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gerffeson-lab/platform-pipelines-templates/actions/security/secret-scan@v1

  build:
    name: build, testes e SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar usa o histórico para saber o que é código novo

      - uses: gerffeson-lab/platform-pipelines-templates/actions/java/maven-build@v1
        with:
          java-version: ${{ inputs.java-version }}

      - uses: gerffeson-lab/platform-pipelines-templates/actions/sonar/maven@v1
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          organization: ${{ vars.SONAR_ORGANIZATION }}
          project-key: ${{ inputs.sonar-project-key || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}

      # SBOM do JAR final: inclui as dependências transitivas empacotadas
      - uses: gerffeson-lab/platform-pipelines-templates/actions/security/sbom@v1
        with:
          target: target/*.jar

  sca:
    name: SCA
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: gerffeson-lab/platform-pipelines-templates/actions/security/sca@v1
        with:
          target: sbom.cdx.json

  image:
    name: imagem
    needs: [contract, secrets, build, sca]
    if: inputs.publish-image && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - uses: gerffeson-lab/platform-pipelines-templates/actions/container/build-push@v1
        with:
          image: ${{ github.repository }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Fase 2 (CD): renderizar o Helm (helm-library) com os values do serviço e commitar no
  # repo GitOps do produto; o Argo CD sincroniza.
