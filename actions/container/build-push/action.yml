name: container-build-push
description: >-
  Build da imagem (Dockerfile do repositório), scan de vulnerabilidades da imagem (Grype,
  inclui os pacotes do sistema operacional da imagem base) e, se aprovada, push para o
  registry com tags por branch, versão semântica e SHA. Na POC é o ghcr.io; no banco, o Quay.

inputs:
  registry:
    description: Endereço do registry
    default: ghcr.io
  image:
    description: "Nome da imagem sem o registry (ex.: org/servico)"
    required: true
  username:
    description: Usuário do registry
    required: true
  password:
    description: Senha ou token do registry
    required: true
  context:
    description: Contexto do build
    default: .
  scan:
    description: Faz o scan da imagem antes do push
    default: 'true'
  fail-on:
    description: >-
      Severidade mínima que bloqueia o push (com correção disponível). Padrão "none" (só
      relatório) até existir a imagem base curada pela plataforma: hoje as vulnerabilidades da
      imagem vêm dos pacotes do sistema da base, que o time do serviço não consegue corrigir
    default: none

outputs:
  digest:
    description: Digest da imagem publicada
    value: ${{ steps.build.outputs.digest }}
  tags:
    description: Tags publicadas
    value: ${{ steps.meta.outputs.tags }}

runs:
  using: composite
  steps:
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,prefix=sha-

    - uses: docker/setup-buildx-action@v3

    # Build local para o scan; o push reaproveita o cache do builder
    - if: inputs.scan == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        load: true
        tags: imagem-em-analise:local

    - if: inputs.scan == 'true'
      shell: bash
      run: docker save imagem-em-analise:local -o "$RUNNER_TEMP/imagem.tar"

    - if: inputs.scan == 'true'
      uses: gerffeson-lab/platform-pipelines-templates/actions/security/sca@v1
      with:
        target: ${{ runner.temp }}/imagem.tar
        type: docker-archive
        fail-on: ${{ inputs.fail-on }}

    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
