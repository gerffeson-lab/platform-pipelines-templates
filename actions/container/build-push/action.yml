name: container-build-push
description: >-
  Build da imagem (Dockerfile do repositório) e push para o registry, com tags por
  branch, versão semântica e SHA. Na POC é o ghcr.io; no banco, o Quay.

inputs:
  registry:
    description: Endereço do registry
    default: ghcr.io
  image:
    description: "Nome da imagem sem o registry (ex.: org/servico)"
    required: true
  username:
    description: Usuário do registry
    required: true
  password:
    description: Senha ou token do registry
    required: true
  context:
    description: Contexto do build
    default: .

outputs:
  digest:
    description: Digest da imagem publicada
    value: ${{ steps.build.outputs.digest }}
  tags:
    description: Tags publicadas
    value: ${{ steps.meta.outputs.tags }}

runs:
  using: composite
  steps:
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,prefix=sha-

    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - uses: docker/setup-buildx-action@v3

    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
