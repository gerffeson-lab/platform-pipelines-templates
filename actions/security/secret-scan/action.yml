name: secret-scan
description: >-
  Procura segredos no histórico do Git (Gitleaks). Exige checkout com fetch-depth 0.

inputs:
  gitleaks-version:
    description: Tag da imagem zricethezav/gitleaks
    default: v8.30.1

runs:
  using: composite
  steps:
    - name: Secret scanning (Gitleaks)
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
      run: |
        docker run --rm -v "$PWD:/repo:ro" "zricethezav/gitleaks:$GITLEAKS_VERSION" \
          git /repo --redact --verbose
